[project]
name = "ha-voice-normalizer"
version = "0.1.0"
description = "Deterministic speech-to-text normalization (phonetic spelling) for Home Assistant"
readme = "README.md"
requires-python = ">=3.14.2"
license = "MIT"
authors = [{ name = "Bjørn-Olav Strand", email = "bolav@ikke.no" }]
keywords = ["home-assistant", "speech-to-text", "nato", "phonetic", "normalization"]
dependencies = []

[project.urls]
Homepage = "https://github.com/bolav/ha-voice-normalizer"
Issues = "https://github.com/bolav/ha-voice-normalizer/issues"

[project.scripts]
ha-voice-normalizer = "ha_voice_normalizer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The core lives inside the custom component so that a HACS install, which
# copies only custom_components/voice_normalizer/, ships the library with it.
# The wheel published to PyPI still exposes it as a top-level ha_voice_normalizer.
packages = ["custom_components/voice_normalizer/ha_voice_normalizer"]

[tool.uv]
# The build backend above exists so the core can be published to PyPI, but uv
# must not install this project into the dev environment: the sandboxed dev
# container has no network and tests import the core straight from the tree.
package = false

[dependency-groups]
dev = [
  "hassil",
  # Pinned to what this Home Assistant version's frontend component asks for.
  # Without it Home Assistant boots into recovery mode, which serves no UI and
  # loads no custom integrations, so `hass -c .ha` cannot exercise this repo.
  "home-assistant-frontend==20260729.7",
  "home-assistant-intents",
  "homeassistant",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "pytest-homeassistant-custom-component",
  "pytest-timeout",
  "pytest-xdist",
  "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "C4", "D", "E", "F", "I", "N", "PT", "RET", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--quiet", "--timeout=60", "--strict-markers"]
